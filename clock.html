<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital - Múltiplos Fusos Horários</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: #e0e0e0;
            font-size: 1.1em;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: slideIn 0.6s ease-out forwards;
        }

        .clock-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timezone-name {
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .city-name {
            color: #b0e0e6;
            font-size: 0.9em;
            text-align: center;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .digital-clock {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-family: 'Courier New', monospace;
            border: 2px solid rgba(76, 175, 80, 0.5);
        }

        .time {
            color: #4caf50;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }

        .date {
            color: #90ee90;
            font-size: 0.85em;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            font-weight: bold;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        button.active {
            background: #4caf50;
            border-color: #4caf50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }

        .format-toggle {
            text-align: center;
            color: #fff;
            margin-top: 20px;
        }

        .format-toggle label {
            cursor: pointer;
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .format-toggle label:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .format-toggle input {
            margin-right: 8px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .time {
                font-size: 1.8em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕐 Relógio Digital - Múltiplos Fusos Horários</h1>
            <p>Visualize a hora em diferentes partes do mundo</p>
        </div>

        <div class="controls">
            <button class="active" onclick="mostrarTodos()">Mostrar Todos</button>
            <button onclick="filtrarContinente('Americas')">Américas</button>
            <button onclick="filtrarContinente('Europe')">Europa</button>
            <button onclick="filtrarContinente('Asia')">Ásia</button>
            <button onclick="filtrarContinente('Africa')">África</button>
            <button onclick="filtrarContinente('Oceania')">Oceania</button>
        </div>

        <div class="format-toggle">
            <label>
                <input type="radio" name="format" value="24" checked onchange="mudarFormato('24')">
                Formato 24h
            </label>
            <label>
                <input type="radio" name="format" value="12" onchange="mudarFormato('12')">
                Formato 12h
            </label>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Os relógios serão inseridos aqui via JavaScript -->
        </div>
    </div>

    <script>
        const timezones = [
            // Americas
            { name: 'New York', timezone: 'America/New_York', continent: 'Americas' },
            { name: 'São Paulo', timezone: 'America/Sao_Paulo', continent: 'Americas' },
            { name: 'Los Angeles', timezone: 'America/Los_Angeles', continent: 'Americas' },
            { name: 'Toronto', timezone: 'America/Toronto', continent: 'Americas' },
            { name: 'México', timezone: 'America/Mexico_City', continent: 'Americas' },
            { name: 'Buenos Aires', timezone: 'America/Argentina/Buenos_Aires', continent: 'Americas' },

            // Europe
            { name: 'Londres', timezone: 'Europe/London', continent: 'Europe' },
            { name: 'Paris', timezone: 'Europe/Paris', continent: 'Europe' },
            { name: 'Berlin', timezone: 'Europe/Berlin', continent: 'Europe' },
            { name: 'Madrid', timezone: 'Europe/Madrid', continent: 'Europe' },
            { name: 'Moscou', timezone: 'Europe/Moscow', continent: 'Europe' },
            { name: 'Istambul', timezone: 'Europe/Istanbul', continent: 'Europe' },

            // Asia
            { name: 'Dubai', timezone: 'Asia/Dubai', continent: 'Asia' },
            { name: 'Tóquio', timezone: 'Asia/Tokyo', continent: 'Asia' },
            { name: 'Bangkok', timezone: 'Asia/Bangkok', continent: 'Asia' },
            { name: 'Hong Kong', timezone: 'Asia/Hong_Kong', continent: 'Asia' },
            { name: 'Singapura', timezone: 'Asia/Singapore', continent: 'Asia' },
            { name: 'Bangalore', timezone: 'Asia/Kolkata', continent: 'Asia' },
            { name: 'Xangai', timezone: 'Asia/Shanghai', continent: 'Asia' },

            // Africa
            { name: 'Cairo', timezone: 'Africa/Cairo', continent: 'Africa' },
            { name: 'Johanesburgo', timezone: 'Africa/Johannesburg', continent: 'Africa' },
            { name: 'Lagos', timezone: 'Africa/Lagos', continent: 'Africa' },
            { name: 'Nairobi', timezone: 'Africa/Nairobi', continent: 'Africa' },

            // Oceania
            { name: 'Sydney', timezone: 'Australia/Sydney', continent: 'Oceania' },
            { name: 'Auckland', timezone: 'Pacific/Auckland', continent: 'Oceania' },
            { name: 'Melbourne', timezone: 'Australia/Melbourne', continent: 'Oceania' }
        ];

        let formatoAtual = '24';
        let continenteAtual = null;

        function atualizarRelógios() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            let relogiosFiltrados = timezones;
            if (continenteAtual) {
                relogiosFiltrados = timezones.filter(tz => tz.continent === continenteAtual);
            }

            relogiosFiltrados.forEach((tz, index) => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="timezone-name">${tz.name}</div>
                    <div class="city-name">${tz.timezone}</div>
                    <div class="digital-clock">
                        <div class="time" id="time-${index}">--:--:--</div>
                        <div class="date" id="date-${index}">--/--/----</div>
                    </div>
                `;
                grid.appendChild(card);

                atualizarHora(index, tz.timezone);
            });
        }

        function atualizarHora(index, timezone) {
            const agora = new Date();
            const horaLocal = new Date(agora.toLocaleString('pt-BR', { timeZone: timezone }));

            let horas = String(horaLocal.getHours()).padStart(2, '0');
            let minutos = String(horaLocal.getMinutes()).padStart(2, '0');
            let segundos = String(horaLocal.getSeconds()).padStart(2, '0');

            if (formatoAtual === '12') {
                const periodo = horas >= 12 ? 'PM' : 'AM';
                horas = String((horas % 12) || 12).padStart(2, '0');
                document.getElementById(`time-${index}`).textContent = `${horas}:${minutos}:${segundos} ${periodo}`;
            } else {
                document.getElementById(`time-${index}`).textContent = `${horas}:${minutos}:${segundos}`;
            }

            const dia = String(horaLocal.getDate()).padStart(2, '0');
            const mes = String(horaLocal.getMonth() + 1).padStart(2, '0');
            const ano = horaLocal.getFullYear();
            document.getElementById(`date-${index}`).textContent = `${dia}/${mes}/${ano}`;
        }

        function atualizarTodos() {
            let relogiosFiltrados = timezones;
            if (continenteAtual) {
                relogiosFiltrados = timezones.filter(tz => tz.continent === continenteAtual);
            }

            relogiosFiltrados.forEach((tz, index) => {
                atualizarHora(index, tz.timezone);
            });

            setTimeout(atualizarTodos, 1000);
        }

        function mudarFormato(formato) {
            formatoAtual = formato;
            atualizarRelógios();
        }

        function mostrarTodos() {
            continenteAtual = null;
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            atualizarRelógios();
        }

        function filtrarContinente(continente) {
            continenteAtual = continente;
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            atualizarRelógios();
        }

        // Inicializar
        window.addEventListener('load', () => {
            atualizarRelógios();
            atualizarTodos();
        });
    </script>
</body>
</html>
